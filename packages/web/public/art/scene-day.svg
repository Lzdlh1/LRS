<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 220" preserveAspectRatio="xMidYMax slice">
  <!-- 昼 · 同一套木刻语言，值一翻：夜里反白的狼，白天压暗；
       松林和近景带各降一档，暖色基线代替朱红。仍然不铺大面积亮色 —— 会糊掉面板。 -->

  <!-- 山脊雾气（暖） -->
  <polygon fill="#ffefd2" opacity=".1" points="-20,104 180,96 500,90 840,106 1170,66 1520,92 1820,76 1820,96 1520,112 1170,86 840,126 500,110 180,116 -20,124"/>

  <!-- 三只鸟：给天空一点动静，也是"这是白天"的标记 -->
  <g fill="none" stroke="#1b2733" stroke-opacity=".34" stroke-width="2.4" stroke-linecap="round">
    <polyline points="1046,62 1060,52 1074,62"/>
    <polyline points="1100,44 1112,36 1124,44"/>
    <polyline points="1152,58 1164,50 1176,58"/>
  </g>

  <polygon fill="#46586e" points="-20,220 -20,124 180,116 500,110 840,126 1170,86 1520,112 1820,96 1820,220"/>
  <polyline fill="none" stroke="#ffefd2" stroke-opacity=".4" stroke-width="2.2"
            points="-20,124 180,116 500,110 840,126 1170,86 1520,112 1820,96"/>

  <polygon fill="#24313f" points="460,124 472,96 484,124 496,88 508,124 520,100 532,124 544,80 556,124 568,94 580,124 592,84 604,124 616,98 628,124 640,78 652,124 664,92 676,124 688,86 700,124 712,96 724,124 736,82 748,124 760,94 772,124 784,88 796,124 808,98 820,124 832,80 844,124 856,92 868,124 880,86 892,124 904,96 916,124 916,220 460,220"/>

  <polygon fill="#24313f" points="184,54 156,58 150,52 144,38 140,51 133,40 129,52 125,58 121,68 111,62 100,64 91,65 86,55 80,72 91,73 88,93 91,114 102,114 101,78 115,78 118,114 129,114 126,78 135,68 142,66 150,65 164,62 178,59"/>

  <rect x="72" y="111" width="120" height="5" fill="#c9762f" opacity=".92"/>

  <!-- 谷地雾带（暖，白天更明显） -->
  <rect x="-20" y="138" width="1840" height="40" fill="#ffe6bc" opacity=".1"/>

  <polygon fill="#16202b" points="-20,220 -20,176 300,168 620,182 1000,170 1350,180 1820,172 1820,220"/>
</svg>
