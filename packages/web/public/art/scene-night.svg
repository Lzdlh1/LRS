<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 220" preserveAspectRatio="xMidYMax slice">
  <!-- 夜 · 木刻平涂。三块值 + 一条红线：
       远山 #1e3050 / 松林 #080d18 / 近景带 #080d18 / 米纸 #efe6d2 / 朱红 #b8342a。
       画幅刻意做成 8:1 —— 地平线落在屏幕底部约 1/6，不跟面板抢地方。 -->

  <!-- 山脊雾气：贴在脊线之上的一条淡带。先画，让山脊切掉下半部分 -->
  <polygon fill="#efe6d2" opacity=".055" points="-20,104 180,96 500,90 840,106 1170,66 1520,92 1820,76 1820,96 1520,112 1170,86 840,126 500,110 180,116 -20,124"/>

  <polygon fill="#1e3050" points="-20,220 -20,124 180,116 500,110 840,126 1170,86 1520,112 1820,96 1820,220"/>
  <polyline fill="none" stroke="#efe6d2" stroke-opacity=".34" stroke-width="2.2"
            points="-20,124 180,116 500,110 840,126 1170,86 1520,112 1820,96"/>

  <!-- 松林：站在山脊上 -->
  <polygon fill="#080d18" points="460,124 472,96 484,124 496,88 508,124 520,100 532,124 544,80 556,124 568,94 580,124 592,84 604,124 616,98 628,124 640,78 652,124 664,92 676,124 688,86 700,124 712,96 724,124 736,82 748,124 760,94 772,124 784,88 796,124 808,98 820,124 832,80 844,124 856,92 868,124 880,86 892,124 904,96 916,124 916,220 460,220"/>

  <!-- 狼：反白剪影（米纸色），朝右对着月亮 -->
  <polygon fill="#efe6d2" points="184,54 156,58 150,52 144,38 140,51 133,40 129,52 125,58 121,68 111,62 100,64 91,65 86,55 80,72 91,73 88,93 91,114 102,114 101,78 115,78 118,114 129,114 126,78 135,68 142,66 150,65 164,62 178,59"/>

  <!-- 朱红基线：只一条 -->
  <rect x="72" y="111" width="120" height="5" fill="#b8342a" opacity=".92"/>

  <!-- 谷地雾带：横在山脊下半部，把远山和近景分开 -->
  <rect x="-20" y="138" width="1840" height="40" fill="#a8bde8" opacity=".07"/>

  <!-- 近景带：压住画面下缘 -->
  <polygon fill="#080d18" points="-20,220 -20,176 300,168 620,182 1000,170 1350,180 1820,172 1820,220"/>
</svg>
