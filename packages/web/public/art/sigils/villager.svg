<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="平民">
  <defs>
    <radialGradient id="v-plate" cx="50%" cy="36%" r="70%">
      <stop offset="0" stop-color="#2a2f3b"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </radialGradient>
    <linearGradient id="v-ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9d2e6"/>
      <stop offset="1" stop-color="#6b7488"/>
    </linearGradient>
  </defs>

  <circle cx="60" cy="60" r="52" fill="url(#v-plate)"/>
  <circle cx="60" cy="60" r="52" fill="none" stroke="url(#v-ring)" stroke-width="2.4" stroke-opacity="0.7"/>
  <circle cx="60" cy="60" r="45" fill="none" stroke="#c9d2e6" stroke-opacity="0.24" stroke-width="1"/>

  <!-- 屋顶 -->
  <path d="M30 58 L60 32 L90 58" fill="none" stroke="#c9d2e6" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- 屋身 -->
  <rect x="41" y="58" width="38" height="28" rx="2"
        fill="rgba(201,210,230,0.1)" stroke="#c9d2e6" stroke-width="2.4"/>
  <!-- 门 -->
  <rect x="54" y="68" width="12" height="18" rx="1.5"
        fill="rgba(201,210,230,0.16)" stroke="#c9d2e6" stroke-width="1.8"/>
  <!-- 炊烟 -->
  <g fill="none" stroke="#c9d2e6" stroke-opacity="0.55" stroke-width="1.8" stroke-linecap="round">
    <path d="M50 26 q5 -7 0 -13"/>
    <path d="M70 26 q-5 -7 0 -13"/>
  </g>
</svg>
