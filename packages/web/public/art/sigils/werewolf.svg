<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="狼人">
  <defs>
    <radialGradient id="w-plate" cx="50%" cy="36%" r="70%">
      <stop offset="0" stop-color="#3c1f24"/>
      <stop offset="1" stop-color="#100b0f"/>
    </radialGradient>
    <linearGradient id="w-ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f08d84"/>
      <stop offset="1" stop-color="#a83b32"/>
    </linearGradient>
    <filter id="w-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="60" cy="60" r="52" fill="url(#w-plate)"/>
  <circle cx="60" cy="60" r="52" fill="none" stroke="url(#w-ring)" stroke-width="2.4" stroke-opacity="0.75"/>
  <circle cx="60" cy="60" r="45" fill="none" stroke="#d2554a" stroke-opacity="0.28" stroke-width="1"/>

  <!-- 正面狼头面具：全直线不画曲线（圆脸曲线 = 猫），尖耳 + 前突长吻 + 颊部锯齿鬃毛 -->
  <path d="M22 12 L30 46 L18 55 L26 61 L17 67 L28 72 L44 70 L48 88 L48 92 L72 92 L72 88 L76 70 L92 72 L103 67 L94 61 L102 55 L90 46 L98 12 L68 30 L60 36 L52 30 Z"
        fill="#1b1013" stroke="#d2554a" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- 耳内 -->
  <path d="M28 22 L33 42 L46 32 Z" fill="#d2554a" fill-opacity="0.3"/>
  <path d="M92 22 L87 42 L74 32 Z" fill="#d2554a" fill-opacity="0.3"/>
  <!-- 吻部中脊 -->
  <path d="M60 40 V84" stroke="#d2554a" stroke-width="1.4" stroke-opacity="0.28"/>
  <!-- 眼：斜切缝（越"睁眼圆"越像猫） -->
  <g filter="url(#w-glow)">
    <path d="M32 54 L50 48 L52.5 52.5 L34.5 58.5 Z" fill="#ffd9d4"/>
    <path d="M88 54 L70 48 L67.5 52.5 L85.5 58.5 Z" fill="#ffd9d4"/>
  </g>
  <!-- 鼻 -->
  <path d="M54 80 L66 80 L60 89 Z" fill="#d2554a" fill-opacity="0.6"/>
  <!-- 獠牙 -->
  <path d="M47 78 l5.5 0 l-2.6 10 Z" fill="#ffe8e4"/>
  <path d="M67.5 78 l5.5 0 l-2.9 10 Z" fill="#ffe8e4"/>
</svg>
