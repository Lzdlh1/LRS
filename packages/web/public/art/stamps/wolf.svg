<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="查杀">
  <defs>
    <!-- 朱砂印：用噪声位移做出斑驳的边 -->
    <filter id="st-wolf-rough" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g transform="rotate(-9 60 60)" filter="url(#st-wolf-rough)">
    <circle cx="60" cy="60" r="43" fill="none" stroke="#c8402f" stroke-width="6"/>
    <circle cx="60" cy="60" r="34" fill="none" stroke="#c8402f" stroke-width="1.8" stroke-dasharray="3 5"/>
    <text x="60" y="53" text-anchor="middle" font-family="KaiTi,STKaiti,'Noto Serif SC',serif"
          font-size="30" font-weight="700" fill="#c8402f">查</text>
    <text x="60" y="86" text-anchor="middle" font-family="KaiTi,STKaiti,'Noto Serif SC',serif"
          font-size="30" font-weight="700" fill="#c8402f">杀</text>
  </g>
</svg>
