<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>六角色立绘 · 联络表</title>
<style>
  body { margin:0; background:#efe6d2; padding:16px;
         font:12px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; }
  .grid { display:grid; grid-template-columns:repeat(3, 300px); gap:14px; }
  figure { margin:0; }
  .box { width:300px; height:390px; background:#16263f; border:3px solid #16263f; border-radius:4px;
         overflow:hidden; display:grid; place-items:center; }
  .box img { width:100%; height:100%; object-fit:cover; object-position:50% 8%; display:block; }
  figcaption { margin-top:6px; font-size:13px; font-weight:700; color:#16263f; letter-spacing:.08em; }
  figcaption span { color:#8c8375; font-weight:400; }

  /* ── 下面这段与 SeatColumn.vue / App.vue 里的裁切规则逐条一致，用来验取景 ── */
  .avatars { display:flex; gap:18px; align-items:flex-end; margin-bottom:26px; }
  .avatar {
    position: relative; width:44px; height:44px; flex:none;
    border-radius:50%; overflow:hidden;
    background: linear-gradient(180deg,#2b3348 0%,#1e2534 100%);
    border:1px solid #465171;
    display:grid; place-items:center;
  }
  .avatar .face {
    position:absolute; inset:0;
    background-repeat:no-repeat;
    background-size:340% auto;
    background-position:var(--crop, 50% -2%);
  }
  .avatar .num {
    position:relative; z-index:1;
    font:700 18px/1 ui-monospace, monospace; color:#e7ebf7;
    text-shadow: 0 1px 4px rgba(0,0,0,.95), 0 0 3px rgba(0,0,0,.85);
  }
  .chipface { width:22px; height:22px; border-radius:50%; overflow:hidden; position:relative;
              background:#16263f; display:inline-block; vertical-align:middle; margin-right:6px; }
  .chipface i { position:absolute; inset:0; background-repeat:no-repeat;
                background-size:340% auto; background-position:var(--crop, 50% -2%); }
  .chipline { display:flex; align-items:center; gap:14px; padding:8px 12px; background:#efe6d2;
              border:3px solid #16263f; border-radius:5px; color:#16263f; font-weight:700; font-size:11px; }
  .label { font-size:12px; color:#16263f; font-weight:700; margin:0 0 8px; letter-spacing:.08em; }
</style>
</head>
<body>
<p class="label">44px 座位头像（与 App 同一段裁切规则）</p>
<div class="avatars" id="av"></div>

<p class="label">22px 底牌（顶栏）</p>
<div class="chipline" id="chip"></div>

<p class="label" style="margin-top:26px">全身立绘</p>
<div class="grid" id="g"></div>
<script>
const ROLES = [
  ['werewolf', '狼人', 'werewolf'],
  ['seer', '预言家', 'seer'],
  ['witch', '女巫', 'witch'],
  ['hunter', '猎人', 'hunter'],
  ['guard', '守卫', 'guard'],
  ['villager', '村民', 'villager'],
];
const src = (f) => `/packages/web/public/art/portraits/${f}.jpg`;
/** 取景：全身方图放大 340% 后，把镜头对到脸上。狼人的头偏右，单独给一格 */
const CROP = { werewolf: '64% -4%' };
const cropOf = (r) => CROP[r] ?? '50% -2%';

// 座位头像：立绘 + 压在胸口的座位号
const av = document.getElementById('av');
ROLES.forEach(([file, label], i) => {
  const d = document.createElement('div');
  d.innerHTML = `<div class="avatar" title="${label}">`
    + `<i class="face" style="--crop:${cropOf(file)};background-image:url('${src(file)}')"></i>`
    + `<span class="num">${i + 1}</span></div>`;
  av.appendChild(d);
});

// 底牌小卡
const chip = document.getElementById('chip');
ROLES.forEach(([file, label]) => {
  const s = document.createElement('span');
  s.innerHTML = `<span class="chipface"><i style="--crop:${cropOf(file)};background-image:url('${src(file)}')"></i></span>2 号 · ${label}`;
  chip.appendChild(s);
});

const g = document.getElementById('g');
for (const [file, label, en] of ROLES) {
  const fig = document.createElement('figure');
  fig.innerHTML = `<div class="box"><img src="${src(file)}" alt="${label}"></div>`
    + `<figcaption>${label} <span>${en}</span></figcaption>`;
  g.appendChild(fig);
}
</script>
</body>
</html>
