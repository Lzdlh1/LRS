<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>层序与剪影分工</title>
<style>html,body{margin:0;padding:0;background:#111}</style>
<script src="./node_modules/p5/lib/p5.min.js"></script>
<script src="./node_modules/p5.brush/dist/p5.brush.js"></script>
</head>
<body>
<script>
const W = 600, H = 600, P = 600;
const WOLF = [
  [0, 3], [16, 12], [20, 9], [24, 0], [27, 10], [32, 1], [35, 13],
  [40, 17], [47, 18], [57, 19], [64, 12], [69, 24], [60, 25],
  [62, 38], [60, 54], [52, 54], [53, 28],
  [43, 28], [41, 54], [33, 54], [35, 28],
  [28, 19], [20, 15], [8, 9],
];
let frames = 0, painted = false;
function setup() { pixelDensity(1); const c = createCanvas(W, H, WEBGL); c.parent(document.body); c.id('c'); window.__w = W; window.__h = H; }

function brushLayer(w, h) {
  brush.noStroke();
  const a = color('#05080f'), b = color('#3d5a92');
  for (let i = 0; i < 24; i++) {
    const t = i / 23;
    brush.wash(lerpColor(a, b, t), 255); brush.rect(-2, (h / 24) * i, w + 4, h / 24 + 2); brush.noWash();
  }
  // 远山（水彩，柔）
  brush.fill('#1c2b4a', 200); brush.fillBleed(0.05, 'out'); brush.fillTexture(0.2, 0.1, false);
  brush.beginShape(0.16);
  for (const p of [[-20, h], [-20, h * 0.6], [w * 0.16, h * 0.47], [w * 0.42, h * 0.56], [w * 0.62, h * 0.44], [w * 0.86, h * 0.5], [w + 20, h * 0.46], [w + 20, h]]) brush.vertex(p[0], p[1]);
  brush.endShape(true);
  brush.fillBleed(0, 'out'); brush.fillTexture(0, 0, false);
}

function nativeSilhouettes(w, h) {
  // 原生平涂：剪影要的是准和实，水彩做不到
  noStroke();
  fill('#0a1220');
  beginShape();
  for (const p of [[-20, h], [-20, h * 0.84], [w * 0.22, h * 0.76], [w * 0.52, h * 0.86], [w * 0.8, h * 0.78], [w + 20, h * 0.84], [w + 20, h]]) vertex(p[0], p[1]);
  endShape(CLOSE);

  fill('#04070d');
  const t = [[-20, h]];
  let x = -20;
  while (x < w * 0.42) {
    const tw = 26 + random(22), th = 90 + random(90);
    t.push([x, h * 0.9]); t.push([x + tw / 2, h * 0.9 - th]); t.push([x + tw, h * 0.9]);
    x += tw * 0.6;
  }
  t.push([w * 0.42, h]);
  beginShape();
  for (const p of t) vertex(p[0], p[1]);
  endShape(CLOSE);

  const ws = (h / 600) * 2.6, woy = h * 0.47 - 54 * ws;
  fill('#02040a');
  beginShape();
  for (const p of WOLF) {
    const px = w * 0.55 + p[0] * ws;
    vertex(px, woy + p[1] * ws + p[0] * ws * 0.08);
  }
  endShape(CLOSE);

  // 月
  fill('#f7f2e0'); circle(w * 0.24, h * 0.19, 56);
}

function draw() {
  frames += 1;
  if (!painted) {
    painted = true;
    randomSeed(11);
    brush.scaleBrushes(2.6);
    background('#ded6c6');
    push(); translate(-W / 2, -H / 2);
    brushLayer(P, P);
    pop();
    push(); translate(-W / 2, -H / 2);
    nativeSilhouettes(P, P);
    pop();
  }
  if (frames >= 3) window.__ready = true;
}
</script>
</body>
</html>
